name: Continuous 24-7 Playwright Bot

on:
  schedule:
    # Triggers a fresh runner window automatically every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger button capability

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux Framebuffer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxss1 libnss3 libnspr4 libgbm1

      - name: Install All Python Packages
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv discord.py

      - name: Install Playwright Standalone Browser Binaries
        run: |
          # Installs the precise Chromium testing build engine used by Playwright
          playwright install chromium

      - name: Load Environment Variables and Execute Bot
        run: |
          # Read your existing .env file and export keys into the step memory
          export $(grep -v '^#' .env | xargs)
          
          # xvfb-run opens a hidden graphic screen layer so headless=False functions perfectly
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python rain.py
