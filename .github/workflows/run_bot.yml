
name: Continuous 24-7 Playwright Bot
 
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: donutluck-rain-monitor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      RAIN_ROLE_ID: ${{ secrets.RAIN_ROLE_ID }}
      BIG_RAIN_ROLE_ID: ${{ secrets.BIG_RAIN_ROLE_ID }}
      HEADLESS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxss1 libnss3 libnspr4 libgbm1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv discord.py

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Start DonutLuck Rain Monitor
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python -u rain.py
