
name: Continuous 24-7 Playwright Bot

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Prevent multiple bot instances from running simultaneously.
concurrency:
  group: donutluck-rain-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '1560149229907869791' }}
      RAIN_ROLE_ID: ${{ vars.RAIN_ROLE_ID || '0' }}
      BIG_RAIN_ROLE_ID: ${{ vars.BIG_RAIN_ROLE_ID || '0' }}

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv discord.py

      - name: Install Chromium and Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Start DonutLuck Rain Monitor
        run: |
          xvfb-run -a \
            --server-args="-screen 0 1280x1024x24" \
            python -u rain.py
