
name: DonutLuck API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-test:
    name: Test DonutLuck API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run API test
        run: python -u api_rain.py
